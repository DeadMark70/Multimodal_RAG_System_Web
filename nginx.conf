limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api_generation:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=4r/m;
limit_conn_zone $binary_remote_addr zone=api_connections:10m;

upstream backend_api {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200m;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @rate_limited;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://*.googleusercontent.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Upload and OCR work is intentionally the strictest public API class.
    location ~ ^/(pdfmd/(ocr|upload_pdf_md)|imagemd/translate_image|multimodal/extract)$ {
        limit_req zone=api_upload burst=1 nodelay;
        limit_conn api_connections 10;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Streamed RAG responses must remain unbuffered for SSE clients.
    location ~ ^/rag/(ask|execute|agentic)/stream$ {
        limit_req zone=api_generation burst=3 nodelay;
        limit_conn api_connections 3;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Non-stream RAG generation receives the same request budget without the SSE cap.
    location ~ ^/rag/(ask|research|plan|execute)$ {
        limit_req zone=api_generation burst=3 nodelay;
        limit_conn api_connections 10;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health checks do not consume public API request or connection budgets.
    location ^~ /health/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    # General FastAPI traffic (including routes not classified above).
    location ~ ^/(pdfmd|rag|imagemd|multimodal|stats|graph|api)/ {
        limit_req zone=api_general burst=30 nodelay;
        limit_conn api_connections 10;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{ "error": { "code": "RATE_LIMITED", "message": "請求過於頻繁，請稍後再試" } }';
    }

    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # Vite SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
