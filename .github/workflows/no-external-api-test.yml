name: Frontend No-External-API Test

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_TEST_MODE: "true"
      VITE_MOCK_MODE: "true"
      VITE_API_BASE_URL: "http://127.0.0.1:8000"
      VITE_SUPABASE_URL: "http://127.0.0.1:54321"
      VITE_SUPABASE_ANON_KEY: "test-anon-key"
      CI_BLOCK_EXTERNAL_NETWORK: "true"
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (no warnings)
        run: npm run lint:ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test Node scripts
        run: npm run test:scripts

      - name: Run Vitest
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build

      - name: Check generated UI docs
        run: npm run docs:check

      - name: Check Markdown links
        run: npm run docs:links

      - name: Checkout backend contract
        uses: actions/checkout@v4
        with:
          repository: DeadMark70/multimodal-rag-translate
          ref: main
          path: contract-backend

      - name: Check backend OpenAPI contract
        run: npm run contract:check -- --backend contract-backend
